<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canto ETA 🎤 Apresentação & Encerramento </title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: rgba(20, 20, 20, 0.9);
            --accent-color: #ff9800;
            --part1-color: #2196f3;
            --loop-color: #4caf50;
            --ending-color: #f44336;
            --text-color: #ffffff;
            --subtext-color: #b0b0b0;
            --success-color: #4caf50;
            --btn-off: #424242;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-image: url('image_6.png');
            background-size: cover; background-position: center;
            background-repeat: no-repeat; background-attachment: fixed;
            color: var(--text-color);
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%; max-width: 480px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 20px; border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; gap: 14px;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
        }
        .header h2 { margin: 0; font-size: 1.1rem; color: #ff4; }

        .btn-back {
            background: rgba(255,255,255,0.15); color: #fff; border: none;
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
        }

        .nav-tabs {
            display: flex; background: rgba(0,0,0,0.4);
            border-radius: 10px; padding: 4px; gap: 4px; border: 1px solid rgba(255,255,255,0.08);
        }
        .tab-btn {
            flex: 1; padding: 8px 4px; font-size: 0.8rem; font-weight: bold;
            background: transparent; color: var(--subtext-color); border: none;
            border-radius: 8px; cursor: pointer; text-align: center; text-transform: uppercase;
        }
        .tab-btn.active { background: var(--accent-color); color: #000; }

        .tab-content { display: none; flex-direction: column; gap: 12px; }
        .tab-content.active { display: flex; }

        .song-title-box { text-align: center; margin-top: 5px; }
        .song-title-box h3 { margin: 0 0 4px 0; font-size: 1.15em; color: #fff; }
        .song-title-box small { color: #ff4; font-size: 0.9em; text-transform: uppercase; }

        .timer-box {
            text-align: center; background: rgba(0,0,0,0.4);
            padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 8px;
        }

        .timer-inner { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .timer-display { font-size: 1.8rem; font-weight: bold; font-family: monospace; color: #fff; }
        .status-display { font-size: 1rem; font-weight: bold; font-family: monospace; color: var(--accent-color); background: rgba(255,152,0,0.15); padding: 4px 12px; border-radius: 6px; text-transform: uppercase; }

        .progress-bar-bg {
            width: 100%; height: 14px; background: rgba(255,255,255,0.12);
            border-radius: 7px; overflow: hidden; cursor: pointer;
            position: relative; border: 1px solid rgba(255,255,255,0.15);
            touch-action: none;
        }
        .progress-bar-bg:hover { background: rgba(255,255,255,0.2); }
        .progress-bar-fill {
            height: 100%; width: 0%; background: var(--accent-color);
            transition: width 0.05s linear; pointer-events: none;
        }

        .options-bar {
            display: flex; gap: 8px; align-items: center;
            background: rgba(0,0,0,0.3); padding: 10px 12px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .options-bar label { font-size: 0.8rem; color: var(--subtext-color); font-weight: bold; }
        .options-bar select { flex: 1; padding: 6px 8px; font-size: 0.8rem; }

        .player-controls { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        button {
            padding: 14px; font-size: 1rem; font-weight: bold;
            border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-play { background: #4caf50; color: #fff; }
        .btn-pause-play { background: #ff9800; color: #000; }
        .btn-climax { background: var(--ending-color); color: #fff; display: none; width: 100%; }
        .btn-climax.armed { animation: pulse 0.8s infinite alternate; background: #ff5252 !important; }
        .btn-stop { background: rgba(220, 20, 20, 0.85); color: #fff; }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.75; transform: scale(0.98); }
        }

        .toast { font-size: 0.8rem; text-align: center; color: #ff4; min-height: 18px; font-style: italic; }

        .pedal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .pedal-card {
            background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 6px;
        }
        .pedal-title { font-size: 0.8rem; font-weight: bold; color: var(--accent-color); display: flex; justify-content: space-between; }
        .pedal-key-badge { font-size: 0.65rem; background: #333; padding: 2px 4px; border-radius: 4px; color: var(--subtext-color); }
        
        select {
            width: 100%; padding: 8px; font-size: 0.8rem;
            background: #2a2a2a; color: var(--text-color);
            border: 1px solid #444; border-radius: 8px; outline: none; cursor: pointer;
        }
        .test-box {
            background: rgba(0,0,0,0.4); border: 2px dashed rgba(255,255,255,0.2); padding: 10px;
            border-radius: 8px; text-align: center; font-size: 0.8rem; color: var(--subtext-color);
        }
        .test-box.active { border-color: var(--success-color); color: var(--success-color); font-weight: bold; background: rgba(76, 175, 80, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🎤 Apresentação ETA</h2>
        <button class="btn-back" onclick="window.location.href='index.html'">⬅ Voltar</button>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('playerTab')">🎛️ Player Show</button>
        <button class="tab-btn" onclick="switchTab('pedalTab')">🦿 Pedal MIDI</button>
    </div>

    <!-- TELA 1: PLAYER -->
    <div id="playerTab" class="tab-content active">
        <div class="song-title-box">
            <h3 id="songTitle">Carregando...</h3>
            <small id="songInterpreter">--</small>
        </div>

        <div class="timer-box">
            <div class="timer-inner">
                <span id="timerDisplay" class="timer-display">00:00.0</span>
                <span id="statusDisplay" class="status-display">Pronto</span>
            </div>
            <div id="progressBarBg" class="progress-bar-bg" title="Clique ou arraste para buscar na faixa">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
        </div>

        <div class="options-bar">
            <label for="loopTransitionMode">Transição para o Loop:</label>
            <select id="loopTransitionMode">
                <option value="crossfade">🔄 Crossfade Suave</option>
                <option value="cut">✂️ Corte Seco (Direto)</option>
            </select>
        </div>

        <div class="player-controls">
            <button id="btnPlay" class="btn-play" disabled>▶ INICIAR APRESENTAÇÃO</button>
            <div class="controls-row">
                <button id="btnPausePlay" class="btn-pause-play" disabled>⏸ PAUSE</button>
                <button id="btnStop" class="btn-stop">■ PARAR</button>
            </div>
            <button id="btnClimax" class="btn-climax">🔥 DISPARAR REFRÃO FINAL (CLÍMAX)</button>
        </div>

        <div id="toastMessage" class="toast">Aguardando carregamento dos áudios...</div>
    </div>

    <!-- TELA 2: PEDAL -->
    <div id="pedalTab" class="tab-content">
        <div style="font-size: 0.8rem; color: var(--subtext-color); text-align: center;">
            Mapeamento do <b>M-Vave Chocolate Plus</b> (Modo Keyboard):
        </div>

        <div class="pedal-grid">
            <div class="pedal-card">
                <div class="pedal-title"><span>PEDAL A</span><span class="pedal-key-badge">PageUp</span></div>
                <select id="actionPedalA" onchange="savePedalConfig()">
                    <option value="stop">⏹ Parar / Resetar</option>
                    <option value="play">▶ Iniciar Apresentação</option>
                    <option value="pausePlay">⏸ Pause / Play</option>
                    <option value="climax">🔥 Clímax / Refrão Final</option>
                </select>
            </div>

            <div class="pedal-card">
                <div class="pedal-title"><span>PEDAL B</span><span class="pedal-key-badge">PageDown</span></div>
                <select id="actionPedalB" onchange="savePedalConfig()">
                    <option value="climax">🔥 Clímax / Refrão Final</option>
                    <option value="play">▶ Iniciar Apresentação</option>
                    <option value="pausePlay">⏸ Pause / Play</option>
                    <option value="stop">⏹ Parar / Resetar</option>
                </select>
            </div>

            <div class="pedal-card">
                <div class="pedal-title"><span>PEDAL C</span><span class="pedal-key-badge">Espaço</span></div>
                <select id="actionPedalC" onchange="savePedalConfig()">
                    <option value="play">▶ Iniciar Apresentação</option>
                    <option value="pausePlay">⏸ Pause / Play</option>
                    <option value="climax">🔥 Clímax / Refrão Final</option>
                    <option value="stop">⏹ Parar / Resetar</option>
                </select>
            </div>

            <div class="pedal-card">
                <div class="pedal-title"><span>PEDAL D</span><span class="pedal-key-badge">Enter</span></div>
                <select id="actionPedalD" onchange="savePedalConfig()">
                    <option value="pausePlay">⏸ Pause / Play</option>
                    <option value="stop">⏹ Parar / Resetar</option>
                    <option value="play">▶ Iniciar Apresentação</option>
                    <option value="climax">🔥 Clímax / Refrão Final</option>
                </select>
            </div>
        </div>

        <div id="testPedalBox" class="test-box">
            🦶 <b>TESTE DO PEDAL:</b> Pise em qualquer botão do Chocolate Plus para validar o sinal.
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const musica = urlParams.get('musica') || 'Apresentação';
    const cantor = urlParams.get('cantor') || 'Intérprete';
    const stemsEncoded = urlParams.get('stems');

    document.getElementById('songTitle').textContent = musica;
    document.getElementById('songInterpreter').textContent = cantor;

    const btnPlay = document.getElementById('btnPlay');
    const btnPausePlay = document.getElementById('btnPausePlay');
    const btnClimax = document.getElementById('btnClimax');
    const btnStop = document.getElementById('btnStop');
    const timerDisplay = document.getElementById('timerDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const progressBarBg = document.getElementById('progressBarBg');
    const progressBarFill = document.getElementById('progressBarFill');
    const toastMessage = document.getElementById('toastMessage');
    const loopTransitionModeSelect = document.getElementById('loopTransitionMode');

    let audioCtx = null;
    function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    let bufferPart1 = null;
    let bufferLoop = null;
    let bufferClimax = null;

    let sourcePart1 = null;
    let sourceLoop = null;
    let sourceClimax = null;

    let gainPart1 = null;
    let gainLoop = null;
    let gainClimax = null;

    let currentState = 'IDLE'; // IDLE, MUSICA, LOOPING, CLIMAX, PAUSED, FINISHED
    let startTime = 0;
    let pauseElapsed = 0;
    let part1Offset = 0;
    let climaxOffset = 0;
    let activeDuration = 0;
    let syncInterval = null;

    let pedalConfig = {
        'pageup': 'stop',
        'pagedown': 'climax',
        ' ': 'play',
        'enter': 'pausePlay'
    };

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if (tabId === 'playerTab') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('playerTab').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('pedalTab').classList.add('active');
        }
    }

    function loadConfigs() {
        const savedPedal = localStorage.getItem('eta_apresentacao_pedal');
        if (savedPedal) {
            try {
                pedalConfig = JSON.parse(savedPedal);
                document.getElementById('actionPedalA').value = pedalConfig['pageup'] || 'stop';
                document.getElementById('actionPedalB').value = pedalConfig['pagedown'] || 'climax';
                document.getElementById('actionPedalC').value = pedalConfig[' '] || 'play';
                document.getElementById('actionPedalD').value = pedalConfig['enter'] || 'pausePlay';
            } catch(e){}
        }
        const savedMode = localStorage.getItem('eta_apresentacao_loop_mode');
        if (savedMode) {
            loopTransitionModeSelect.value = savedMode;
        }
    }

    function savePedalConfig() {
        pedalConfig = {
            'pageup': document.getElementById('actionPedalA').value,
            'pagedown': document.getElementById('actionPedalB').value,
            ' ': document.getElementById('actionPedalC').value,
            'enter': document.getElementById('actionPedalD').value
        };
        localStorage.setItem('eta_apresentacao_pedal', JSON.stringify(pedalConfig));
    }

    loopTransitionModeSelect.addEventListener('change', () => {
        localStorage.setItem('eta_apresentacao_loop_mode', loopTransitionModeSelect.value);
    });

    function normalizarUrl(url) {
        if (!url) return '';
        let u = url.trim();
        if (u.includes('dropbox.com')) return u.replace(/([?&])dl=[01]/, '$1dl=1');
        if (u.includes('drive.google.com') && u.includes('/d/')) {
            const id = u.split('/d/')[1].split('/')[0];
            return `https://docs.google.com/uc?export=download&id=${id}`;
        }
        if (!u.startsWith('http')) {
            return window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1) + u;
        }
        return u;
    }

    async function carregarAudioBuffer(url) {
        const ctx = getAudioContext();
        const res = await fetch(normalizarUrl(url));
        if (!res.ok) throw new Error(`Falha ao buscar: ${url}`);
        const arrayBuffer = await res.arrayBuffer();
        return await ctx.decodeAudioData(arrayBuffer);
    }

    async function inicializarPlayer() {
        loadConfigs();
        if (!stemsEncoded) {
            toastMessage.textContent = 'Nenhum áudio fornecido.';
            return;
        }

        try {
            const rawStems = JSON.parse(decodeURIComponent(stemsEncoded));
            toastMessage.textContent = 'Baixando áudios da apresentação...';

            for (let i = 0; i < rawStems.length; i++) {
                const item = rawStems[i];
                const url = typeof item === 'object' ? item.url : item;
                if (!url || url.length < 5) continue;

                const urlLower = url.toLowerCase();
                const buffer = await carregarAudioBuffer(url);

                if (i === 0) {
                    bufferPart1 = buffer;
                } else if (urlLower.includes('-loop') || urlLower.includes('loop') || i === 1) {
                    bufferLoop = buffer;
                } else if (urlLower.includes('-fim') || urlLower.includes('-stop') || urlLower.includes('-climax') || i >= 2) {
                    bufferClimax = buffer;
                }
            }

            if (bufferPart1 || bufferLoop) {
                btnPlay.disabled = false;
                toastMessage.textContent = 'Pronto para apresentação!';
            } else {
                toastMessage.textContent = 'Erro: Nenhum áudio principal encontrado.';
            }

        } catch (err) {
            console.error(err);
            toastMessage.textContent = 'Erro ao decodificar áudios.';
        }
    }

    let pausedStateBefore = null;

    function getCurrentElapsed() {
        if (!audioCtx) return 0;
        if (currentState === 'PAUSED') return pauseElapsed;
        const raw = audioCtx.currentTime - startTime;
        if (currentState === 'LOOPING' && activeDuration > 0) {
            return raw % activeDuration;
        }
        return Math.max(0, raw);
    }

    function updateUiFromElapsed(elapsed) {
        const dur = activeDuration > 0 ? activeDuration : 0;
        const remaining = Math.max(0, dur - elapsed);
        const percent = dur > 0 ? Math.min(100, Math.max(0, (elapsed / dur) * 100)) : 0;
        progressBarFill.style.width = `${percent}%`;

        const mins = Math.floor(remaining / 60).toString().padStart(2, '0');
        const secs = Math.floor(remaining % 60).toString().padStart(2, '0');
        const ms = Math.floor((remaining % 1) * 10);
        timerDisplay.textContent = `${mins}:${secs}.${ms}`;
    }

    function iniciarPart1At(offsetSec = 0) {
        const ctx = getAudioContext();
        if (sourcePart1) {
            sourcePart1.onended = null;
            try { sourcePart1.stop(); } catch(e){}
            sourcePart1 = null;
        }

        const safeOffset = Math.max(0, Math.min(offsetSec, Math.max(0, bufferPart1.duration - 0.05)));
        part1Offset = safeOffset;
        currentState = 'MUSICA';
        statusDisplay.textContent = 'Música';
        activeDuration = bufferPart1.duration;
        startTime = ctx.currentTime - safeOffset;

        gainPart1 = ctx.createGain();
        gainPart1.gain.setValueAtTime(1, ctx.currentTime);
        gainPart1.connect(ctx.destination);

        sourcePart1 = ctx.createBufferSource();
        sourcePart1.buffer = bufferPart1;
        sourcePart1.connect(gainPart1);
        sourcePart1.start(0, safeOffset);

        sourcePart1.onended = () => {
            if (currentState === 'MUSICA') {
                entrarNoLoopInstrumental();
            }
        };

        btnPlay.disabled = true;
        btnPausePlay.disabled = false;
        btnPausePlay.textContent = '⏸ PAUSE';
        btnClimax.style.display = 'block';
        startTimer();
    }

    function iniciarApresentacao() {
        if (currentState !== 'IDLE' && currentState !== 'PAUSED') {
            pararTudo();
        }
        solicitarWakeLock();

        const ctx = getAudioContext();

        if (currentState === 'PAUSED') {
            if (ctx.state === 'suspended') {
                ctx.resume();
            }
            const resumedState = pausedStateBefore || (sourceLoop ? 'LOOPING' : (sourcePart1 ? 'MUSICA' : 'CLIMAX'));
            currentState = resumedState;
            statusDisplay.textContent = (currentState === 'LOOPING' ? 'Loop' : (currentState === 'MUSICA' ? 'Música' : 'Clímax Final'));
            startTime = ctx.currentTime - pauseElapsed;
            btnPausePlay.textContent = '⏸ PAUSE';
            startTimer();
            return;
        }

        if (bufferPart1) {
            iniciarPart1At(0);
        } else {
            entrarNoLoopInstrumental(0);
            btnPlay.disabled = true;
            btnPausePlay.disabled = false;
            btnPausePlay.textContent = '⏸ PAUSE';
            btnClimax.style.display = 'block';
            startTimer();
        }
    }

    function alternarPausePlay() {
        if (currentState === 'IDLE') {
            iniciarApresentacao();
            return;
        }
        
        const ctx = getAudioContext();
        if (currentState === 'PAUSED') {
            iniciarApresentacao();
        } else {
            pauseElapsed = getCurrentElapsed();
            pausedStateBefore = currentState;
            if (ctx.state === 'running') {
                ctx.suspend();
            }
            currentState = 'PAUSED';
            statusDisplay.textContent = 'Pausado';
            btnPausePlay.textContent = '▶ RETOMAR';
            stopTimer();
            toastMessage.textContent = '⏸ Apresentação pausada';
            setTimeout(() => { if(currentState === 'PAUSED') toastMessage.textContent = ''; }, 2000);
        }
    }

    function entrarNoLoopInstrumental(offsetSec = 0) {
        if (!bufferLoop) return;
        const ctx = getAudioContext();
        const prevPart1Source = sourcePart1;
        const prevPart1Gain = gainPart1;
        sourcePart1 = null;
        gainPart1 = null;

        currentState = 'LOOPING';
        statusDisplay.textContent = 'Loop';
        activeDuration = bufferLoop.duration;
        const safeOffset = activeDuration > 0 ? (offsetSec % activeDuration) : 0;
        startTime = ctx.currentTime - safeOffset;

        gainLoop = ctx.createGain();
        gainLoop.connect(ctx.destination);

        sourceLoop = ctx.createBufferSource();
        sourceLoop.buffer = bufferLoop;
        sourceLoop.loop = true;
        sourceLoop.connect(gainLoop);

        const mode = loopTransitionModeSelect.value;

        if (mode === 'crossfade' && prevPart1Source && prevPart1Gain) {
            gainLoop.gain.setValueAtTime(0, ctx.currentTime);
            gainLoop.gain.linearRampToValueAtTime(1, ctx.currentTime + 0.8);
            sourceLoop.start(0, safeOffset);

            prevPart1Gain.gain.setValueAtTime(1, ctx.currentTime);
            prevPart1Gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
            setTimeout(() => { 
                if (prevPart1Source) {
                    prevPart1Source.onended = null;
                    try { prevPart1Source.stop(); } catch(e){} 
                } 
            }, 900);
        } else {
            gainLoop.gain.setValueAtTime(1, ctx.currentTime);
            if (prevPart1Source) {
                prevPart1Source.onended = null;
                try { prevPart1Source.stop(); } catch(e){}
            }
            sourceLoop.start(0, safeOffset);
        }
    }

    function iniciarClimaxAt(offsetSec = 0) {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        if (sourceClimax) {
            sourceClimax.onended = null;
            try { sourceClimax.stop(); } catch(e){}
            sourceClimax = null;
        }

        const wasAlreadyClimax = (currentState === 'CLIMAX');
        currentState = 'CLIMAX';
        statusDisplay.textContent = 'Clímax Final';
        btnClimax.style.display = 'none';
        btnPausePlay.disabled = false;
        btnPausePlay.textContent = '⏸ PAUSE';

        if (bufferClimax) {
            const safeOffset = Math.max(0, Math.min(offsetSec, Math.max(0, bufferClimax.duration - 0.05)));
            climaxOffset = safeOffset;
            activeDuration = bufferClimax.duration;
            startTime = ctx.currentTime - safeOffset;

            gainClimax = ctx.createGain();
            gainClimax.gain.setValueAtTime(1, ctx.currentTime);
            gainClimax.connect(ctx.destination);

            sourceClimax = ctx.createBufferSource();
            sourceClimax.buffer = bufferClimax;
            sourceClimax.connect(gainClimax);
            sourceClimax.start(0, safeOffset);

            if (!wasAlreadyClimax) {
                if (gainLoop && sourceLoop) {
                    const oldLoop = sourceLoop;
                    const oldLoopGain = gainLoop;
                    sourceLoop = null;
                    gainLoop = null;
                    oldLoopGain.gain.setValueAtTime(1, ctx.currentTime);
                    oldLoopGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.5);
                    setTimeout(() => { try { oldLoop.stop(); } catch(e){} }, 1600);
                }
                if (gainPart1 && sourcePart1) {
                    const oldPart1 = sourcePart1;
                    const oldPart1Gain = gainPart1;
                    sourcePart1 = null;
                    gainPart1 = null;
                    oldPart1.onended = null;
                    oldPart1Gain.gain.setValueAtTime(1, ctx.currentTime);
                    oldPart1Gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.5);
                    setTimeout(() => { try { oldPart1.stop(); } catch(e){} }, 1600);
                }
            }

            sourceClimax.onended = () => {
                if (currentState === 'CLIMAX') {
                    pararTudo();
                    statusDisplay.textContent = 'Finalizado';
                    toastMessage.textContent = 'Apresentação encerrada com sucesso.';
                }
            };
            startTimer();
        } else {
            pararTudo();
            statusDisplay.textContent = 'Finalizado';
        }
    }

    function dispararClimax() {
        if (currentState !== 'LOOPING' && currentState !== 'MUSICA' && currentState !== 'PAUSED') return;
        iniciarClimaxAt(0);
    }

    function buscarPosicaoNaBarra(clientX) {
        if (!progressBarBg) return;
        const rect = progressBarBg.getBoundingClientRect();
        if (rect.width <= 0) return;
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));

        if (currentState === 'IDLE') {
            if (bufferPart1) {
                const targetSec = ratio * bufferPart1.duration;
                solicitarWakeLock();
                iniciarPart1At(targetSec);
                updateUiFromElapsed(targetSec);
            } else if (bufferLoop) {
                const targetSec = ratio * bufferLoop.duration;
                solicitarWakeLock();
                entrarNoLoopInstrumental(targetSec);
                btnPlay.disabled = true;
                btnPausePlay.disabled = false;
                btnPausePlay.textContent = '⏸ PAUSE';
                btnClimax.style.display = 'block';
                startTimer();
                updateUiFromElapsed(targetSec);
            }
            return;
        }

        const activeState = (currentState === 'PAUSED') ? pausedStateBefore : currentState;
        if (!activeDuration || activeDuration <= 0) return;
        const targetSec = ratio * activeDuration;

        if (activeState === 'MUSICA' && bufferPart1) {
            iniciarPart1At(targetSec);
        } else if (activeState === 'LOOPING' && bufferLoop) {
            if (sourceLoop) {
                try { sourceLoop.stop(); } catch(e){}
                sourceLoop = null;
            }
            if (sourcePart1) {
                sourcePart1.onended = null;
                try { sourcePart1.stop(); } catch(e){}
                sourcePart1 = null;
            }
            entrarNoLoopInstrumental(targetSec);
            startTimer();
        } else if (activeState === 'CLIMAX' && bufferClimax) {
            iniciarClimaxAt(targetSec);
        }

        if (currentState === 'PAUSED') {
            pauseElapsed = targetSec;
            if (audioCtx && audioCtx.state === 'running') {
                audioCtx.suspend();
            }
        }
        updateUiFromElapsed(targetSec);
    }

    let isScrubbing = false;
    progressBarBg.addEventListener('pointerdown', (e) => {
        isScrubbing = true;
        progressBarBg.setPointerCapture(e.pointerId);
        buscarPosicaoNaBarra(e.clientX);
    });
    progressBarBg.addEventListener('pointermove', (e) => {
        if (!isScrubbing) return;
        buscarPosicaoNaBarra(e.clientX);
    });
    progressBarBg.addEventListener('pointerup', (e) => {
        if (!isScrubbing) return;
        isScrubbing = false;
        buscarPosicaoNaBarra(e.clientX);
    });
    progressBarBg.addEventListener('pointercancel', () => {
        isScrubbing = false;
    });

    function pararTudo() {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') {
            ctx.resume();
        }

        currentState = 'IDLE';
        pausedStateBefore = null;
        pauseElapsed = 0;
        part1Offset = 0;
        climaxOffset = 0;

        if (sourcePart1) { sourcePart1.onended = null; try { sourcePart1.stop(); } catch(e){} sourcePart1 = null; }
        if (sourceLoop) { try { sourceLoop.stop(); } catch(e){} sourceLoop = null; }
        if (sourceClimax) { sourceClimax.onended = null; try { sourceClimax.stop(); } catch(e){} sourceClimax = null; }

        btnPlay.disabled = false;
        btnPausePlay.disabled = true;
        btnPausePlay.textContent = '⏸ PAUSE';
        btnClimax.style.display = 'none';
        statusDisplay.textContent = 'Pronto';
        progressBarFill.style.width = '0%';
        timerDisplay.textContent = '00:00.0';
        stopTimer();
    }

    btnPlay.addEventListener('click', iniciarApresentacao);
    btnPausePlay.addEventListener('click', alternarPausePlay);
    btnClimax.addEventListener('click', dispararClimax);
    btnStop.addEventListener('click', pararTudo);

    function startTimer() {
        stopTimer();
        syncInterval = setInterval(() => {
            if (currentState === 'PAUSED' || currentState === 'IDLE') return;
            updateUiFromElapsed(getCurrentElapsed());
        }, 50);
    }

    function stopTimer() { if (syncInterval) clearInterval(syncInterval); }

    function triggerAction(actionName) {
        switch (actionName) {
            case 'play': if (!btnPlay.disabled) iniciarApresentacao(); break;
            case 'pausePlay': alternarPausePlay(); break;
            case 'climax': dispararClimax(); break;
            case 'stop': pararTudo(); break;
        }
    }

    document.addEventListener('keydown', (e) => {
        const rawKey = e.key;
        const key = rawKey.toLowerCase();

        const testBox = document.getElementById('testPedalBox');
        if (testBox) {
            testBox.classList.add('active');
            testBox.innerHTML = `✅ SINAL RECEBIDO! Tecla: <b>"${rawKey}"</b>`;
            setTimeout(() => testBox.classList.remove('active'), 1200);
        }

        if ([' ', 'pagedown', 'pageup', 'arrowup', 'arrowdown', 'enter'].includes(key)) {
            e.preventDefault();
        }

        if (pedalConfig[key]) {
            triggerAction(pedalConfig[key]);
            return;
        }

        switch (key) {
            case ' ':
            case 'enter': triggerAction('play'); break;
            case 'escape': triggerAction('stop'); break;
        }
    });

    let wakeLock = null;
    async function solicitarWakeLock() {
        if ('wakeLock' in navigator) {
            try {
                if (wakeLock && !wakeLock.released) return;
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => {
                    wakeLock = null;
                });
            } catch (err) {}
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        inicializarPlayer();
        solicitarWakeLock();
    });

    ['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
        document.addEventListener(evt, () => {
            if (!wakeLock || wakeLock.released) {
                solicitarWakeLock();
            }
        }, { passive: true });
    });

    document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible') {
            await solicitarWakeLock();
        }
    });
</script>
</body>
</html>

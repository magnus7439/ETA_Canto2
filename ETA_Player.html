<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canto ETA - Roberto.</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="tone.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 10px; color: #fff;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            background-image: url('image_6.png'); 
            background-size: cover; background-position: center;
            background-repeat: no-repeat; background-attachment: fixed;
            padding-bottom: 120px; 
            transition: background 0.3s;
        }
        body.modo-gerenciamento {
            background-image: url('image_del.png') !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
        }

        .glass-panel {
            background: rgba(20, 20, 20, 0.85);
            border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            transition: background 0.3s, border-color 0.3s;
        }
        body.modo-gerenciamento .glass-panel {
            background: rgba(40, 10, 10, 0.75) !important;
            border: 1px solid rgba(255, 80, 80, 0.5) !important;
        }

        .master-player {            
            position: sticky; top: 10px; width: 95%; max-width: 600px;            
            padding: 15px; z-index: 100; text-align: center; margin-bottom: 10px;            
            overflow: hidden; min-height: 45px;
            box-sizing: border-box;
        }
        .player-minimized { resize: none; min-height: 45px; padding-bottom: 10px; }        
        .player-minimized #yt-player, .player-minimized .pitch-control-box, .player-minimized .progress-container { display: none !important; }        
        
        #now-playing { font-weight: bold; margin-bottom: 8px; font-size: 1em; padding-right: 40px; }
        
        .progress-container {
            display: flex; flex-direction: column; gap: 4px; margin-top: 10px; width: 100%;
        }
        .seek-slider {
            width: 100%; height: 6px; border-radius: 3px; accent-color: #00bcd4; cursor: pointer;
        }
        .time-display {
            display: flex; justify-content: space-between; font-size: 0.8em; color: #ccc; font-family: monospace; padding: 0 2px;
        }

        .pitch-control-box {
            display: flex; margin-top: 10px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
            padding: 8px 12px; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
        }
        .pitch-label { font-size: 0.85em; color: #ff4; font-weight: bold; white-space: nowrap; }
        .pitch-buttons-group { display: flex; gap: 5px; align-items: center; }
        .btn-pitch {
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; border-radius: 6px; padding: 5px 10px; font-weight: bold; cursor: pointer; font-size: 0.9em;
        }
        .btn-pitch:active { background: rgba(255, 255, 255, 0.3); }
        #pitch-val-display { font-family: monospace; font-size: 0.9em; font-weight: bold; color: #00bcd4; min-width: 35px; text-align: center; }

        #yt-player { 
            display: none; width: 100%; aspect-ratio: 16/9; border-radius: 10px; border: none; margin-top: 15px; 
        }

        .toggle-player {
            position: absolute; top: 12px; right: 15px;
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            border-radius: 50%; width: 32px; height: 32px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .floating-controls {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); display: none; gap: 10px; z-index: 1000; width: 90%; max-width: 500px;
        }
        .btn-large {
            flex: 1; padding: 15px 5px; border-radius: 12px; font-weight: bold;
            font-size: 0.9em; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px); color: white; text-transform: uppercase;
        }
        .btn-stop { background: rgba(220, 20, 20, 0.8); }
        .btn-pause { background: rgba(20, 80, 220, 0.8); }
        .btn-restart { background: rgba(200, 160, 20, 0.8); color: #000; }

        .list-selector-container { 
            width: 95%; max-width: 600px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; 
        }
        #sheet-selector {
            width: 100%; padding: 12px; border-radius: 25px; background: rgba(100, 50, 150, 0.6);
            color: #ff4; border: 1px solid rgba(255, 255, 255, 0.3); font-weight: bold; outline: none; box-sizing: border-box;
        }
        .selector-buttons-row { display: flex; gap: 8px; width: 100%; }
        .btn-reset-order {
            flex: 1; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; border-radius: 25px; padding: 10px; cursor: pointer; font-size: 0.85em;
            font-weight: bold; text-transform: uppercase; outline: none;
        }
        .btn-cache-action {
            flex: 1; border: 1px solid rgba(255,255,255,0.3); color: #ff4; border-radius: 25px;
            padding: 10px; cursor: pointer; font-size: 0.85em; font-weight: bold; text-align: center; text-transform: uppercase;
        }
        .btn-gerenciar-toggle { background: rgba(180, 80, 20, 0.6); color: #fff; }
        body.modo-gerenciamento .btn-gerenciar-toggle {
            background: rgba(220, 40, 40, 0.9); animation: pulsar 1.5s infinite;
        }
        @keyframes pulsar { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .search-container { width: 95%; max-width: 480px; margin-bottom: 20px; position: relative; }
        #search-input {
            width: 100%; padding: 12px 45px 12px 20px; border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.1);
            color: #fff; font-size: 1em; outline: none; box-sizing: border-box;
        }
        .clear-search {
            position: absolute; right: 12px; top: 7px; background: rgba(255, 255, 255, 0.2);
            border: none; color: #ff4; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: none;
        }

        ul { list-style: none; padding: 0; width: 95%; max-width: 700px; min-height: 100px; }
        li { margin: 12px 0; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        
        li.is-separator { background: rgba(100, 50, 150, 0.6) !important; border: 1px solid rgba(255, 255, 255, 0.5); }
        li.is-study { background: rgba(100, 50, 150, 0.4) !important; border: 1px solid rgba(180, 100, 255, 0.4); }

        .separator-content { display: grid; grid-template-columns: 35px 1fr; align-items: center; }
        .separator-title { font-size: 1.2em; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-align: center; width: 100%; color: #ff4; }

        .li-main-row { display: grid; grid-template-columns: 35px 35px 1fr auto; align-items: center; gap: 10px; }
        .drag-handle { cursor: grab; color: rgba(255,255,255,0.4); font-size: 22px; touch-action: none; padding: 10px; }
        .song-info { display: flex; flex-direction: column; overflow: hidden; }
        .interpreter { color: #ff4; font-weight: bold; font-size: 1.03em; text-transform: uppercase; }
        .song-title { font-size: 1.01em; color: #fff; }

        .action-buttons { display: flex; gap: 8px; }
        .btn-play {
            background: rgba(255, 255, 255, 0.1); color: #ff4; border: none;
            border-radius: 50%; width: 48px; height: 48px; cursor: pointer; font-size: 1.3em;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-cache {
            background: rgba(255, 255, 255, 0.1); color: #fff; border: none;
            border-radius: 50%; width: 48px; height: 48px; cursor: pointer; font-size: 1.1em;
            display: flex; align-items: center; justify-content: center; transition: 0.3s background;
        }
        .btn-cache.cached { background: rgba(30, 180, 80, 0.6); color: #fff; }
        .btn-delete-sheet {
            background: rgba(220, 20, 20, 0.9); color: #fff; border: none;
            border-radius: 50%; width: 48px; height: 48px; cursor: pointer;
            display: none; align-items: center; justify-content: center; font-size: 1.2em;
        }
        
        body.modo-gerenciamento .btn-play, body.modo-gerenciamento .btn-cache { display: none !important; }
        body.modo-gerenciamento .btn-delete-sheet { display: flex !important; }

        .done { opacity: 0.3; filter: grayscale(100%); }
        .notes-field {
            background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 255, 255, 0.2);
            color: #ccc; font-size: 0.9em; padding: 8px; border-radius: 8px; outline: none; min-height: 20px;
        }
    </style>
</head>
<body>
    <div id="main-player-container" class="master-player glass-panel player-minimized">
        <button class="toggle-player" id="btn-toggle" onclick="togglePlayer()">▼</button>
        <div id="now-playing">Selecione uma faixa</div>
        
        <div id="progress-panel" class="progress-container">
            <input type="range" id="seek-bar" class="seek-slider" min="0" max="100" value="0" oninput="seekingAudio(this.value)">
            <div class="time-display">
                <span id="time-current">00:00</span>
                <span id="time-total">00:00</span>
            </div>
        </div>

        <div id="pitch-control-panel" class="pitch-control-box">
            <span class="pitch-label" id="pitch-key-label">🎵 Tom: --</span>
            <div class="pitch-buttons-group">
                <button class="btn-pitch" onclick="alterarPitch(-1)">-</button>
                <span id="pitch-val-display">0 st</span>
                <button class="btn-pitch" onclick="alterarPitch(1)">+</button>
                <button class="btn-pitch" style="font-size: 0.75em; padding: 5px 6px;" onclick="resetarPitch()" title="Resetar Tom">Reset</button>
            </div>
        </div>

        <iframe id="yt-player" allow="autoplay"></iframe>
    </div>

    <div class="list-selector-container">
        <select id="sheet-selector" onchange="mudarLista(this.value)">
            <option value="1960210650">📅 DOMINGO</option>
            <option value="1517164028">📅 SEGUNDA-FEIRA</option>
            <option value="216102701">📅 TERÇA-FEIRA</option>
            <option value="911593347">📅 QUARTA-FEIRA</option>
            <option value="1593190716">📅 QUINTA-FEIRA</option>
            <option value="1611821250">📅 SEXTA-FEIRA</option>
            <option value="1644722704">📅 SABADO</option>
        </select>
        
        <div class="selector-buttons-row">
            <button class="btn-reset-order" onclick="resetarOrdemLocal()">Resetar Ordem</button>
            <button class="btn-cache-action" style="background: rgba(30, 80, 180, 0.6);" onclick="baixarMidiasDoDia()">⬇️ Baixar Este Dia</button>
            <button class="btn-cache-action" style="background: rgba(180, 30, 30, 0.6); color: #fff;" onclick="limparMidiasDoDia()">🗑️ Apagar Este Dia</button>
        </div>

        <div class="selector-buttons-row">
            <button class="btn-cache-action btn-gerenciar-toggle" onclick="alternarModoGerenciamento()" id="btn-modo-gerenciar">⚙️ Modo Apagar Itens</button>
        </div>
    </div>

    <div id="float-ctrl" class="floating-controls">
        <button class="btn-large btn-restart" onclick="restartMedia()">↺ Início</button>
        <button id="btn-pause-float" class="btn-large btn-pause" onclick="pauseMedia()">⏸ Pausar</button>
        <button class="btn-large btn-stop" onclick="stopAll()">■ Stop</button>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="🔍 Buscar música ou intérprete..." oninput="filtrarLista()">
        <button class="clear-search" id="btn-clear" onclick="limparBusca()">✕</button>
    </div>

    <ul id="playlist-sortable"></ul>

    <script>
        const BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSUwdgFWo3-RvINecYfmj0aMZBEKTeGjMkUoJrq-QvwzFTzKRU3XiMCQkDgxsNRtxMha2bTeirKvD8N/pub?output=csv';
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxqmg3eUhrIuoc079APaiQ028J43eu-kOjw0i9qWoG8cpFAODdD7f3CtwNQHIG0NxNq/exec";

        const urlParams = new URLSearchParams(window.location.search);
        let GID_ATUAL = urlParams.get('gid') || '1960210650';
        
        const CACHE_NAME = 'canto-eta-media-v3';
        let modoGerenciamentoAtivo = false;
        let currentSemitones = 0;
        let tomOriginalExtraido = null;

        let tonePlayer = null;
        let tonePitchShift = null;
        let progressInterval = null;

        const NOTAS_CROMATICAS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const NOTAS_FLAT_MAP = { "Db":"C#", "Eb":"D#", "Gb":"F#", "Ab":"G#", "Bb":"A#" };
        
        const MAPA_EXTENSO = {
            'do': 'C', 'dó': 'C', 're': 'D', 'ré': 'D', 'mi': 'E',
            'fa': 'F', 'fá': 'F', 'sol': 'G', 'la': 'A', 'lá': 'A', 'si': 'B'
        };

        const MAPA_NOMES_DIAS = {
            '1960210650': 'DOMINGO', '1517164028': 'SEGUNDA', '216102701': 'TERÇA',
            '911593347': 'QUARTA', '1593190716': 'QUINTA', '1611821250': 'SEXTA', '1644722704': 'SABADO'
        };

        window.addEventListener('load', () => {
            const seletor = document.getElementById('sheet-selector');
            if (seletor) seletor.value = GID_ATUAL;
        });

        function getNomeDiaAtual() { return MAPA_NOMES_DIAS[GID_ATUAL] || "DOMINGO"; }

        function safeGetLocal(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
        function safeSetLocal(key, value) { try { localStorage.setItem(key, value); } catch(e) {} }

        function salvarEstadoLocal() {
            const itens = [];
            document.querySelectorAll('#playlist-sortable li').forEach(li => {
                if (!li.dataset.id) return;
                itens.push({
                    id: li.dataset.id,
                    done: li.querySelector('.chk-done')?.checked || false,
                    notas: li.querySelector('.notes-field')?.innerText || ""
                });
            });
            safeSetLocal('ordem_' + GID_ATUAL, JSON.stringify(itens));
        }

        function resetarOrdemLocal() {
            if(confirm("Deseja voltar para a ordem original?")) {
                try { localStorage.removeItem('ordem_' + GID_ATUAL); } catch(e){}
                carregar();
            }
        }

        function formatarTempo(segundos) {
            if (isNaN(segundos) || segundos < 0) return "00:00";
            const mins = Math.floor(segundos / 60);
            const secs = Math.floor(segundos % 60);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function extrairTomDaString(texto) {
            if (!texto) return null;
            let textoLower = texto.toLowerCase();
            for (let nomeExtenso in MAPA_EXTENSO) {
                let regexExtenso = new RegExp(`\\b${nomeExtenso}\\s*(menor|m)?\\b`, 'i');
                if (regexExtenso.test(textoLower)) {
                    let match = textoLower.match(regexExtenso);
                    let notaCifra = MAPA_EXTENSO[nomeExtenso];
                    let ehMenor = (match[1] && match[1].startsWith('m')) ? 'm' : '';
                    return notaCifra + ehMenor;
                }
            }
            const regexCifra = /\b([A-G][#b]?m?)\b/;
            const matchCifra = texto.match(regexCifra);
            if (matchCifra) {
                let nota = matchCifra[1];
                let notaBase = nota.charAt(0).toUpperCase();
                let acidente = (nota.length > 1 && (nota[1] === '#' || nota[1] === 'b')) ? nota[1] : '';
                let menor = nota.toLowerCase().endsWith('m') ? 'm' : '';
                let notaFull = notaBase + acidente;
                if (NOTAS_FLAT_MAP[notaFull]) notaFull = NOTAS_FLAT_MAP[notaFull];
                return notaFull + menor;
            }
            return null;
        }

        function transporNota(notaComTipo, semitones) {
            if (!notaComTipo) return "--";
            let menor = notaComTipo.endsWith('m') ? 'm' : '';
            let notaApenas = menor ? notaComTipo.slice(0, -1) : notaComTipo;
            let idx = NOTAS_CROMATICAS.indexOf(notaApenas);
            if (idx === -1) return notaComTipo;
            let novoIdx = (idx + semitones) % 12;
            if (novoIdx < 0) novoIdx += 12;
            return NOTAS_CROMATICAS[novoIdx] + menor;
        }

        function atualizarDisplayPitch() {
            const valDisplay = document.getElementById('pitch-val-display');
            const keyLabel = document.getElementById('pitch-key-label');
            const txtSemitons = (currentSemitones > 0 ? `+${currentSemitones}` : currentSemitones) + " st";
            if (valDisplay) valDisplay.innerText = txtSemitons;
            if (keyLabel) {
                if (tomOriginalExtraido) {
                    const tomTransposto = transporNota(tomOriginalExtraido, currentSemitones);
                    keyLabel.innerText = currentSemitones === 0 ? `🎵 Tom: ${tomTransposto}` : `🎵 Tom: ${tomTransposto} (Orig: ${tomOriginalExtraido}, ${txtSemitons})`;
                } else {
                    keyLabel.innerText = `🎵 Tom: ${txtSemitons}`;
                }
            }
        }

        function normalizarUrlMidia(media) {
            if (!media) return '';
            let url = media.trim();
            if (url.includes('dropbox.com')) {
                return url.replace(/([?&])dl=[01]/, '$1raw=1').replace(/&st=[^&]*/, '');
            } else if (url.includes('drive.google.com') && url.includes('/d/')) {
                const id = url.split('/d/')[1].split('/')[0];
                return `https://docs.google.com/uc?export=download&id=${id}`;
            }
            return url;
        }

        function pararTonePlayer() {
            if (tonePlayer) {
                try { tonePlayer.stop(); tonePlayer.dispose(); } catch(e){}
                tonePlayer = null;
            }
            if (tonePitchShift) {
                try { tonePitchShift.dispose(); } catch(e){}
                tonePitchShift = null;
            }
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function stopAll() {
            const yt = document.getElementById('yt-player');
            document.getElementById('float-ctrl').style.display = 'none';
            document.getElementById('pitch-control-panel').style.display = 'flex';
            document.getElementById('progress-panel').style.display = 'flex';
            yt.src = ""; yt.style.display = 'none';
            pararTonePlayer();
            currentSemitones = 0;
            tomOriginalExtraido = null;
            atualizarDisplayPitch();
            document.getElementById('main-player-container').classList.add('player-minimized');
            document.getElementById('btn-toggle').innerText = '▼';
            document.getElementById('now-playing').innerText = "Selecione uma faixa";
        }

        function pauseMedia() {
            const btn = document.getElementById('btn-pause-float');
            if (Tone.context.state === "running") {
                Tone.context.suspend();
                btn.innerText = "▶ Play";
            } else {
                Tone.context.resume();
                btn.innerText = "⏸ Pausar";
            }
        }

        function restartMedia() {
            if (tonePlayer && tonePlayer.loaded) {
                tonePlayer.stop();
                tonePlayer.start(0, 0);
                document.getElementById('btn-pause-float').innerText = "⏸ Pausar";
            }
        }

        function seekingAudio(valPorcentagem) {
            if (tonePlayer && tonePlayer.loaded) {
                const duracaoTotal = tonePlayer.buffer.duration;
                const novoTempo = (valPorcentagem / 100) * duracaoTotal;
                const estavaTocando = (Tone.context.state === "running");
                tonePlayer.stop();
                tonePlayer.start(0, novoTempo);
                if (!estavaTocando) Tone.context.suspend();
            }
        }

        function alterarPitch(delta) {
            const novoValor = currentSemitones + delta;
            if (novoValor >= -3 && novoValor <= 3) {
                currentSemitones = novoValor;
                atualizarDisplayPitch();
                if (tonePitchShift) {
                    tonePitchShift.pitch = currentSemitones;
                }
            }
        }

        function resetarPitch() {
            if (currentSemitones !== 0) {
                currentSemitones = 0;
                atualizarDisplayPitch();
                if (tonePitchShift) tonePitchShift.pitch = 0;
            }
        }

        function mudarLista(novoGid) { GID_ATUAL = novoGid; carregar(); }

        function togglePlayer() {
            const container = document.getElementById('main-player-container');
            const isMin = container.classList.toggle('player-minimized');
            document.getElementById('btn-toggle').innerText = isMin ? '▼' : '✕';
        }

        function filtrarLista() {
            const input = document.getElementById('search-input');
            const termo = input.value.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
            document.getElementById('btn-clear').style.display = input.value ? "block" : "none";
            document.querySelectorAll('#playlist-sortable li').forEach(li => {
                const txt = li.innerText.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
                li.style.display = txt.includes(termo) ? (li.classList.contains('is-separator') && termo !== "" ? "none" : "flex") : "none";
            });
        }

        function limparBusca() { document.getElementById('search-input').value = ''; filtrarLista(); }

        function alternarModoGerenciamento() {
            modoGerenciamentoAtivo = !modoGerenciamentoAtivo;
            const body = document.body;
            const btnModo = document.getElementById('btn-modo-gerenciar');
            if (modoGerenciamentoAtivo) {
                body.classList.add('modo-gerenciamento');
                btnModo.innerText = "✖ Sair do Modo Apagar";
            } else {
                body.classList.remove('modo-gerenciamento');
                btnModo.innerText = "⚙️ Modo Apagar Itens";
            }
        }

        async function deletarItemPlanilha(elementoLi) {
            const diaSemana = getNomeDiaAtual();
            const part1 = elementoLi.querySelector('.interpreter')?.innerText.trim() || '';
            const part2 = elementoLi.querySelector('.song-title')?.innerText.trim() || '';
            const notesField = elementoLi.querySelector('.notes-field')?.innerText.trim() || '';
            let infoConcatenada = `${part2} (${part1})`;
            if (elementoLi.classList.contains('is-study')) infoConcatenada = `${part1} (${part2})`;
            if (notesField !== "") infoConcatenada += ` - ${notesField}`;
            if (!confirm(`Deseja realmente apagar este item da planilha de ${diaSemana}?`)) return;
            try {
                elementoLi.style.opacity = "0.3";
                const urlCompleta = `${WEB_APP_URL}?acao=apagarItem&dia=${encodeURIComponent(diaSemana)}&nome=${encodeURIComponent(infoConcatenada)}`;
                await fetch(urlCompleta, { method: 'GET', mode: 'no-cors' });
                elementoLi.remove();
                salvarEstadoLocal();
                alert("Comando de exclusão enviado para a planilha!");
            } catch (error) {
                alert("Houve um erro ao tentar comunicar com a planilha.");
                elementoLi.style.opacity = "1";
            }
        }

        async function toggleCache(url, btnElement) {
            if (!url) return;
            try {
                const cache = await caches.open(CACHE_NAME);
                const response = await cache.match(url);
                if (response) {
                    await cache.delete(url);
                    btnElement.innerText = '⬇️';
                    btnElement.classList.remove('cached');
                } else {
                    btnElement.innerText = '⏳';
                    const req = new Request(url, { mode: 'cors' });
                    const res = await fetch(req);
                    if (!res.ok) throw new Error('Falha');
                    await cache.put(req, res);
                    btnElement.innerText = '🗑️';
                    btnElement.classList.add('cached');
                }
            } catch (error) {
                btnElement.innerText = '⬇️';
            }
        }

        async function atualizarStatusBotoesCache() {
            const botoes = document.querySelectorAll('.btn-cache');
            const cache = await caches.open(CACHE_NAME);
            for (let btn of botoes) {
                const url = btn.dataset.url;
                if (await cache.match(url)) {
                    btn.innerText = '🗑️';
                    btn.classList.add('cached');
                }
            }
        }

        async function baixarMidiasDoDia() {
            const botoes = document.querySelectorAll('#playlist-sortable .btn-cache:not(.cached)');
            if (botoes.length === 0) return alert("Todas as mídias já estão baixadas!");
            if (confirm(`Deseja baixar todas as ${botoes.length} mídias?`)) {
                const cache = await caches.open(CACHE_NAME);
                for (let btn of botoes) {
                    const url = btn.dataset.url;
                    if (!url) continue;
                    btn.innerText = '⏳';
                    try {
                        const res = await fetch(new Request(url, { mode: 'cors' }));
                        if (res.ok) { await cache.put(url, res); btn.innerText = '🗑️'; btn.classList.add('cached'); }
                        else { btn.innerText = '⬇️'; }
                    } catch(e) { btn.innerText = '⬇️'; }
                }
                alert("Downloads concluídos!");
            }
        }

        async function limparMidiasDoDia() {
            const botoes = document.querySelectorAll('#playlist-sortable .btn-cache.cached');
            if (botoes.length === 0) return alert("Não há mídias baixadas.");
            if (confirm("Deseja apagar as mídias da memória?")) {
                const cache = await caches.open(CACHE_NAME);
                for (let btn of botoes) {
                    await cache.delete(btn.dataset.url);
                    btn.innerText = '⬇️'; btn.classList.remove('cached');
                }
                alert("Removido com sucesso!");
            }
        }

        function carregar() {
            const lista = document.getElementById('playlist-sortable');
            lista.innerHTML = '<p style="text-align:center;">Carregando...</p>';
            const xhr = new XMLHttpRequest();
            xhr.open("GET", `${BASE_URL}&gid=${GID_ATUAL}&t=${new Date().getTime()}`, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) renderizar(xhr.responseText);
            };
            xhr.send();
        }

        function inlineSplitCSV(linha) { return linha.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); }

        function renderizar(texto) {
            const lista = document.getElementById('playlist-sortable');
            const linhas = texto.split('\n').map(l => l.trim()).filter(l => l);
            let dadosMap = {};
            linhas.slice(1).forEach((linha, index) => {
                const cols = inlineSplitCSV(linha);
                const id = cols[0]?.replace(/"/g, '') || ('item-'+index);
                dadosMap[id] = {
                    id: id, cantor: cols[1]?.replace(/"/g, '') || '',
                    musica: cols[2]?.replace(/"/g, '') || '',
                    media: cols[3]?.replace(/"/g, '').trim() || '',
                    tipo: (cols[4]?.replace(/"/g, '') || '').toLowerCase().trim(),
                    notes: cols[5]?.replace(/"/g, '') || ''
                };
            });

            const salva = safeGetLocal('ordem_' + GID_ATUAL);
            let idsOrdenados = Object.keys(dadosMap);
            let estadosCheck = {};
            if (salva) {
                try {
                    const objSalvo = JSON.parse(salva);
                    idsOrdenados = objSalvo.map(s => s.id).filter(id => dadosMap[id]);
                    Object.keys(dadosMap).forEach(id => { if (!idsOrdenados.includes(id)) idsOrdenados.push(id); });
                    objSalvo.forEach(s => { estadosCheck[s.id] = { done: s.done, notas: s.notas }; });
                } catch(e) {}
            }

            lista.innerHTML = '';
            idsOrdenados.forEach(id => {
                const item = dadosMap[id];
                if (!item || !item.musica) return;
                const li = document.createElement('li');
                li.className = 'glass-panel';
                li.dataset.id = item.id;
                
                if (item.tipo === 'separador') {
                    li.classList.add('is-separator');
                    li.innerHTML = `<div class="separator-content"><div class="drag-handle">⋮⋮</div><div class="separator-title">${item.musica}</div></div>`;
                } else {
                    const salvoInfo = estadosCheck[item.id] || { done: false, notas: "" };
                    if(salvoInfo.done) li.classList.add('done');
                    const notaFinal = (salvoInfo.notas && salvoInfo.notas.trim() !== "") ? salvoInfo.notas : item.notes;
                    const temMidia = item.media && item.media.length > 5;
                    const ehYouTube = item.media && (item.media.includes('youtube.com') || item.media.includes('youtu.be') || item.media.length === 11);
                    const urlFinal = normalizarUrlMidia(item.media);

                    let displayHTML = item.tipo === 'estudo' ? `<span class="interpreter">${item.musica}</span><span class="song-title">${item.cantor}</span>` : `<span class="interpreter">${item.cantor}</span><span class="song-title">${item.musica}</span>`;

                    let botoesAcao = `
                        <div class="action-buttons">
                            ${temMidia && !ehYouTube ? `<button class="btn-cache" data-url="${urlFinal}" onclick="toggleCache('${urlFinal}', this)">⬇️</button>` : ''}
                            ${temMidia ? `<button class="btn-play" onclick="tocar('${item.tipo}', '${item.media.replace(/'/g, "\\'")}', '${item.cantor.replace(/'/g, "\\'")}', '${item.musica.replace(/'/g, "\\'")}', this.closest('li'))">▶</button>` : ''}
                            <button class="btn-delete-sheet" onclick="deletarItemPlanilha(this.closest('li'))" title="Excluir">🗑️</button>
                        </div>
                    `;

                    li.innerHTML = `
                        <div class="li-main-row">
                            <div class="drag-handle">⋮⋮</div>
                            <input type="checkbox" class="chk-done" ${salvoInfo.done ? 'checked' : ''} onchange="this.closest('li').classList.toggle('done'); salvarEstadoLocal();">
                            <div class="song-info">${displayHTML}</div>
                            ${botoesAcao}
                        </div>
                        <div class="notes-field" contenteditable="true" onblur="salvarEstadoLocal()">${notaFinal}</div>
                    `;
                }
                lista.appendChild(li);
            });

            Sortable.create(lista, { handle: '.drag-handle', animation: 150, delayOnTouchOnly: true, onEnd: salvarEstadoLocal });
            atualizarStatusBotoesCache();
        }

        async function tocar(tipo, media, cantor, musica, elementoLi) {
            const yt = document.getElementById('yt-player');
            const pitchPanel = document.getElementById('pitch-control-panel');
            const progressPanel = document.getElementById('progress-panel');
            
            document.getElementById('main-player-container').classList.remove('player-minimized');
            document.getElementById('btn-toggle').innerText = '✕';
            document.getElementById('now-playing').innerHTML = `Tocando: <b>${musica}</b><br><small>${cantor}</small>`;
            document.getElementById('float-ctrl').style.display = 'flex';
            document.getElementById('btn-pause-float').innerText = "⏸ Pausar";
            
            const notasItem = elementoLi?.querySelector('.notes-field')?.innerText || "";
            tomOriginalExtraido = extrairTomDaString(notasItem) || extrairTomDaString(musica) || extrairTomDaString(cantor);

            yt.src = ""; yt.style.display = 'none';
            pararTonePlayer();
            currentSemitones = 0;
            atualizarDisplayPitch();
            
            const ehYouTube = media.includes('youtube.com') || media.includes('youtu.be') || (media.length === 11 && !media.includes('http'));
            
            if (ehYouTube) {
                pitchPanel.style.display = 'none';
                progressPanel.style.display = 'none';
                yt.style.display = 'block';
                document.getElementById('btn-pause-float').style.display = 'none';
                let id = media.includes('v=') ? media.split('v=')[1].split('&')[0] : (media.includes('be/') ? media.split('be/')[1] : media);
                yt.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            } else {
                pitchPanel.style.display = 'flex';
                progressPanel.style.display = 'flex';
                document.getElementById('btn-pause-float').style.display = 'flex';
                
                let url = normalizarUrlMidia(media);

                try {
                    await Tone.start();

                    // Carregamento direto via Tone.Player com tratamento de fallback nativo se houver falha de decodificação
                    tonePitchShift = new Tone.PitchShift({ pitch: 0 }).toDestination();
                    
                    tonePlayer = new Tone.Player({
                        url: url,
                        autostart: true,
                        onload: () => {
                            document.getElementById('time-total').innerText = formatarTempo(tonePlayer.buffer.duration);
                            iniciarMonitoramentoProgressoTone();
                        },
                        onerror: (e) => {
                            console.error("Erro no player do Tone:", e);
                            alert("Erro ao reproduzir arquivo. Certifique-se de que a URL é um link direto válido.");
                        }
                    }).connect(tonePitchShift);

                } catch (err) {
                    console.error("Erro geral no player:", err);
                    alert("Erro ao iniciar o motor de áudio.");
                }
            }
        }

        function iniciarMonitoramentoProgressoTone() {
            if (progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (tonePlayer && tonePlayer.loaded && tonePlayer.state === "started") {
                    const duracaoTotal = tonePlayer.buffer.duration;
                    const tempoAtual = tonePlayer.progress * duracaoTotal;
                    
                    document.getElementById('seek-bar').value = (tempoAtual / duracaoTotal) * 100;
                    document.getElementById('time-current').innerText = formatarTempo(tempoAtual);
                    document.getElementById('time-total').innerText = formatarTempo(duracaoTotal);

                    if (tempoAtual >= duracaoTotal) {
                        clearInterval(progressInterval);
                        document.getElementById('btn-pause-float').innerText = "▶ Play";
                    }
                }
            }, 200);
        }

        window.addEventListener('DOMContentLoaded', carregar);
    </script>

<!-- Adicionar logo abaixo do .list-selector-container -->
<div class="selector-buttons-row" style="margin-top: 8px;">
    <button class="btn-cache-action" style="background: rgba(180, 80, 20, 0.6); color: #fff;" onclick="abrirPainelGerenciamento()">⚙️ Gerenciar Planilha (Remover Itens)</button>
</div>

<!-- Modal de Gerenciamento -->
<div id="modal-gerenciamento" class="modal-overlay" style="display: none;">
    <div class="glass-panel modal-content">
        <div class="modal-header">
            <h3>Gerenciar Itens - <span id="modal-dia-titulo"></span></h3>
            <button class="toggle-player" onclick="fecharPainelGerenciamento()">✕</button>
        </div>
        <p style="font-size: 0.85em; color: #ccc; margin-bottom: 15px;">Selecione os itens que deseja remover permanentemente da planilha:</p>
        <div id="modal-lista-itens" class="modal-lista-scroll">
            <p style="text-align: center;">Carregando itens da planilha...</p>
        </div>
        <div class="modal-footer">
            <button class="btn-large btn-stop" onclick="apagarItensSelecionados()">🗑️ Apagar Selecionados</button>
            <button class="btn-large" style="background: rgba(100,100,100,0.6);" onclick="fecharPainelGerenciamento()">Fechar</button>
        </div>
    </div>
</div>

<style>
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
        z-index: 2000; display: flex; align-items: center; justify-content: center;
    }
    .modal-content {
        width: 90%; max-width: 500px; max-height: 80vh; padding: 20px;
        display: flex; flex-direction: column; box-sizing: border-box;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; position: relative; }
    .modal-header h3 { margin: 0; font-size: 1.1em; color: #ff4; }
    .modal-header .toggle-player { position: static; }
    .modal-lista-scroll {
        flex: 1; overflow-y: auto; max-height: 50vh; display: flex; flex-direction: column; gap: 8px;
        margin-bottom: 15px; padding-right: 5px;
    }
    .modal-item-row {
        display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05);
        padding: 10px; border-radius: 8px; font-size: 0.9em;
    }
    .modal-item-row input { accent-color: #ff4; width: 18px; height: 18px; cursor: pointer; }
    .modal-footer { display: flex; gap: 10px; }
</style>

<script>
    async function abrirPainelGerenciamento() {
        const modal = document.getElementById('modal-gerenciamento');
        const containerLista = document.getElementById('modal-lista-itens');
        const spanDia = document.getElementById('modal-dia-titulo');
        const diaSemana = getNomeDiaAtual();

        spanDia.innerText = diaSemana;
        modal.style.display = 'flex';
        containerLista.innerHTML = '<p style="text-align: center;">Buscando itens na planilha...</p>';

        try {
            const urlCompleta = `${WEB_APP_URL}?acao=listar&dia=${encodeURIComponent(diaSemana)}`;
            const resposta = await fetch(urlCompleta);
            const itens = await resposta.json();

            if (!itens || itens.length === 0) {
                containerLista.innerHTML = '<p style="text-align: center; color: #aaa;">Nenhum item encontrado para este dia.</p>';
                return;
            }

            let html = '';
            itens.forEach((itemLabel, index) => {
                html += `
                    <div class="modal-item-row">
                        <input type="checkbox" class="chk-gerenciar" value="${encodeURIComponent(itemLabel)}">
                        <span>${itemLabel}</span>
                    </div>
                `;
            });
            containerLista.innerHTML = html;

        } catch (error) {
            console.error("Erro ao carregar lista para gerenciar:", error);
            containerLista.innerHTML = '<p style="text-align: center; color: #ff6b6b;">Erro ao carregar os itens da planilha.</p>';
        }
    }

    function fecharPainelGerenciamento() {
        document.getElementById('modal-gerenciamento').style.display = 'none';
        carregar(); // Recarrega a página principal para refletir possíveis mudanças
    }

    async function apagarItensSelecionados() {
        const checkboxes = document.querySelectorAll('.chk-gerenciar:checked');
        const diaSemana = getNomeDiaAtual();

        if (checkboxes.length === 0) {
            alert("Selecione pelo menos um item para apagar.");
            return;
        }

        if (!confirm(`Tem certeza que deseja apagar os ${checkboxes.length} itens selecionados da planilha (${diaSemana})?`)) return;

        const containerLista = document.getElementById('modal-lista-itens');
        containerLista.innerHTML = '<p style="text-align: center; color: #ff4;">Apagando itens selecionados...</p>';

        try {
            for (let chk of checkboxes) {
                const itemLabel = decodeURIComponent(chk.value);
                const urlCompleta = `${WEB_APP_URL}?acao=apagarItem&dia=${encodeURIComponent(diaSemana)}&nome=${encodeURIComponent(itemLabel)}`;
                
                await fetch(urlCompleta, {
                    method: 'GET',
                    mode: 'no-cors'
                });
            }

            alert("Itens apagados com sucesso!");
            fecharPainelGerenciamento();
            carregar();

        } catch (error) {
            console.error("Erro ao apagar itens em massa:", error);
            alert("Ocorreu um erro durante a exclusão.");
            abrirPainelGerenciamento();
        }
    }
</script>
